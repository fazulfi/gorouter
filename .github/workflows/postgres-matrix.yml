name: PostgreSQL Matrix

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "internal/persistence/**"
      - "tests/integration/postgres/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  COVERAGE_THRESHOLD: 80.0

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.pg-version }}${{ matrix.race == 'on' && ' + race' || '' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg-version: ["16", "17", "18"]
        race: ["off", "on"]
      fail-fast: false

    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gorouter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Wave4 guard: the runner's default pg_dump is 16.x, which aborts against
      # server majors 17/18 ("pg_dump: error: aborting because of server version
      # mismatch"). Wave5: run 31321501787 proved the ubuntu-latest image does
      # NOT ship the PGDG apt source (postgresql-client-17/18 were not
      # locatable), so configure the official PostgreSQL PGDG repository first
      # (official signing key into a dedicated signed-by keyring, codename from
      # /etc/os-release), then install the client major matching the matrix
      # server and prepend its bin dir to PATH so pg_dump/pg_restore resolve
      # version-matched.
      - name: Install PostgreSQL ${{ matrix.pg-version }} client (version-matched)
        run: |
          set -euo pipefail
          PG_MAJOR="${{ matrix.pg-version }}"

          . /etc/os-release
          CODENAME="${UBUNTU_CODENAME:-${VERSION_CODENAME}}"
          sudo curl -fsSL --retry 3 -o /usr/share/postgresql-pgdg.asc \
            "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
          sudo chmod 644 /usr/share/postgresql-pgdg.asc
          sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql-pgdg.gpg \
            /usr/share/postgresql-pgdg.asc
          sudo rm -f /usr/share/postgresql-pgdg.asc
          sudo chmod 644 /usr/share/keyrings/postgresql-pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Assert pg_dump major matches matrix server major
        run: |
          set -euo pipefail
          PG_MAJOR="${{ matrix.pg-version }}"
          echo "resolved pg_dump: $(command -v pg_dump)"
          DUMP_LINE="$(pg_dump --version | head -n1)"
          echo "pg_dump --version: ${DUMP_LINE}"
          DUMP_VERSION="$(echo "${DUMP_LINE}" | awk '{print $3}')"
          if [ "${DUMP_VERSION%%.*}" != "${PG_MAJOR}" ]; then
            echo "::error::pg_dump major ${DUMP_VERSION%%.*} does not match matrix server major ${PG_MAJOR}"
            exit 1
          fi
          echo "::notice::pg_dump major ${PG_MAJOR} matches matrix server major (client ${DUMP_VERSION})"

      - name: Run integration tests ${{ matrix.race == 'on' && 'with race' || '' }}
        run: |
          RACE_FLAG="${{ matrix.race == 'on' && '-race' || '' }}"
          go test $RACE_FLAG -p 1 -count=1 -coverprofile=coverage.out -covermode=atomic -v ./internal/persistence/...
        env:
          # Tests read POSTGRES_TEST_DSN (tx_integration_test.go, auth_repo_test.go)
          # and DATABASE_URL (migrations/runner_test.go), NOT GOROUTER_TEST_DSN.
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/gorouter_test?sslmode=disable
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gorouter_test?sslmode=disable

      - name: Enforce coverage threshold
        run: |
          if [ -f coverage.out ]; then
            total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | sed 's/%//')
            echo "PostgreSQL ${{ matrix.pg-version }} coverage: ${total}%"
            if [ "$(echo "${total} < ${COVERAGE_THRESHOLD}" | bc -l)" -eq 1 ]; then
              echo "::error::Coverage ${total}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            fi
            echo "::notice::Coverage ${total}% meets threshold ${COVERAGE_THRESHOLD}%"
          else
            echo "No coverage file produced — skipping threshold check"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pg${{ matrix.pg-version }}${{ matrix.race == 'on' && '-race' || '' }}
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-${{ matrix.pg-version }}${{ matrix.race == 'on' && '-race' || '' }}-results
          path: |
            **/go-test*.out
            **/coverage.out
          retention-days: 7
          if-no-files-found: ignore

openapi: "3.1.0"
info:
  title: gorouter Admin API
  version: "1.0.0"
  description: |
    Admin API for gorouter - the AI model router.
    All management routes require authentication via session cookie or PAT Bearer token.
    Stream surfaces are session-cookie-only. Credentials are never re-exposed after creation.
  contact:
    name: gorouter project
    url: https://github.com/gorouter

servers:
  - url: /api/admin/v1
    description: Current version prefix

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: gorouter_session
      description: Dashboard session cookie
    PAT:
      type: http
      scheme: bearer
      bearerFormat: pat
      description: Personal Access Token
    APIKey:
      type: http
      scheme: bearer
      description: Model API key (for model endpoints only)

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
          format: uuid

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time

    DetailedHealth:
      allOf:
        - $ref: '#/components/schemas/Health'
        - type: object
          properties:
            version:
              type: string
            uptime_seconds:
              type: integer
            db:
              type: object
              properties:
                connected:
                  type: boolean
                pool_conns_in_use:
                  type: integer
                pool_conns_idle:
                  type: integer
            goroutines:
              type: integer

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    SessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        session_id:
          type: string
          format: uuid
          nullable: true
        csrf_token:
          type: string
          description: CSRF token to echo on mutations (cookie actors)

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'

    CreatePATRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreatePATResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Full PAT value, only shown once
        description:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PAT:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        token_prefix:
          type: string
          description: First 8 characters of the PAT for identification
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreateAPIKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Full API key value, only shown once
        name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: Prefix of the API key for identification; hash-only storage after creation
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [openai, anthropic, azure, custom]
        base_url:
          type: string
          format: uri
        is_enabled:
          type: boolean
        has_api_key:
          type: boolean
          description: Whether a credential is stored for this provider
        api_key_hint:
          type: string
          description: Last 4 characters of the stored credential for identification
        model:
          type: string
        config:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProviderRequest:
      type: object
      required: [name, type, base_url]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [openai, anthropic, azure, custom]
        base_url:
          type: string
          format: uri
        api_key:
          type: string
          description: Provider credential (write-only, encrypted at rest)
        config:
          type: object

    ProviderValidationResult:
      type: object
      properties:
        ok:
          type: boolean
        provider_id:
          type: string
          format: uuid
        latency_ms:
          type: integer
        error:
          type: string
          nullable: true

    ProviderTestBatchRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid

    ProviderTestResult:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        ok:
          type: boolean
        latency_ms:
          type: integer
        error:
          type: string
          nullable: true

    ProviderTestBatchResponse:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProviderTestResult'

    SuggestedModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        kind:
          type: string

    ProviderNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
          format: uri
        weight:
          type: integer
        is_enabled:
          type: boolean
        status:
          type: string
          enum: [healthy, degraded, down, unknown]
        last_checked_at:
          type: string
          format: date-time
          nullable: true

    CreateProviderNodeRequest:
      type: object
      required: [provider_id, name, base_url]
      properties:
        provider_id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
          format: uri
        weight:
          type: integer
        is_enabled:
          type: boolean

    NodeValidationResult:
      type: object
      properties:
        ok:
          type: boolean
        node_id:
          type: string
          format: uuid
        latency_ms:
          type: integer
        error:
          type: string
          nullable: true

    ProxyPool:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [cloudflare, deno, vercel, custom]
        status:
          type: string
          enum: [active, deploying, failed, disabled]
        endpoints:
          type: array
          items:
            type: string
        config:
          type: object
        created_at:
          type: string
          format: date-time

    CreateProxyPoolRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [cloudflare, deno, vercel, custom]
        region:
          type: string
        config:
          type: object

    DeployResult:
      type: object
      properties:
        ok:
          type: boolean
        platform:
          type: string
        target:
          type: string
        url:
          type: string
          nullable: true
        message:
          type: string

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        kind:
          type: string
        is_enabled:
          type: boolean
        is_default:
          type: boolean

    ModelConfigUpdate:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        defaults:
          type: object

    ModelAlias:
      type: object
      properties:
        alias:
          type: string
        target_model:
          type: string
        is_enabled:
          type: boolean

    CustomModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
          format: uri
        has_api_key:
          type: boolean
        api_key_hint:
          type: string
          nullable: true
        is_enabled:
          type: boolean

    DisabledModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        reason:
          type: string

    ModelTestRequest:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
        prompt:
          type: string

    ModelTestResult:
      type: object
      properties:
        ok:
          type: boolean
        model_id:
          type: string
        latency_ms:
          type: integer
        snippet:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    ModelAvailability:
      type: object
      properties:
        model_id:
          type: string
        available:
          type: boolean
        cooldown_until:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true

    Combo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        strategy:
          type: string
          enum: [reorder, round-robin, sequential]
        models:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateComboRequest:
      type: object
      required: [name, strategy, models]
      properties:
        name:
          type: string
        strategy:
          type: string
          enum: [reorder, round-robin, sequential]
        models:
          type: array
          items:
            type: string

    PricingEntry:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        input_per_million:
          type: number
        output_per_million:
          type: number
        updated_at:
          type: string
          format: date-time

    UsageStats:
      type: object
      properties:
        total_requests:
          type: integer
        total_tokens_in:
          type: integer
        total_tokens_out:
          type: integer
        active_requests:
          type: integer
        error_rate:
          type: number
        period:
          type: string

    UsageHistoryEntry:
      type: object
      properties:
        day:
          type: string
          format: date
        requests:
          type: integer
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        errors:
          type: integer

    UsageHistory:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UsageHistoryEntry'

    UsageChartPoint:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        value:
          type: number
        label:
          type: string

    UsageChart:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/UsageChartPoint'

    UsageProviderStat:
      type: object
      properties:
        provider:
          type: string
        requests:
          type: integer
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        errors:
          type: integer
        p95_latency_ms:
          type: integer

    UsageProviders:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/UsageProviderStat'

    UsageRequestDetail:
      type: object
      properties:
        connection_id:
          type: string
        model:
          type: string
        provider:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        error:
          type: string
          nullable: true

    UsageRequestLog:
      type: object
      properties:
        connection_id:
          type: string
        model:
          type: string
        provider:
          type: string
        started_at:
          type: string
          format: date-time
        status:
          type: string
        tokens_in:
          type: integer
        tokens_out:
          type: integer

    UsageRequestLogs:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UsageRequestLog'

    RecentRequest:
      type: object
      properties:
        connection_id:
          type: string
        model:
          type: string
        provider:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        minute:
          type: string
        status:
          type: string
        latency_ms:
          type: integer

    StreamEvent:
      type: object
      properties:
        event:
          type: string
        data:
          type: object
        keepalive_seconds:
          type: integer

    CliToolStatus:
      type: object
      properties:
        tool:
          type: string
        installed:
          type: boolean
        version:
          type: string
          nullable: true
        status:
          type: string
        config_step:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    CliToolsStatus:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/CliToolStatus'
        checked_at:
          type: string
          format: date-time

    MediaProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        is_enabled:
          type: boolean
        config:
          type: object

    Voice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        language:
          type: string
        gender:
          type: string
          nullable: true
        provider:
          type: string

    OAuthAccount:
      type: object
      properties:
        provider:
          type: string
        email:
          type: string
          format: email
          nullable: true
        display_name:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        granted_scopes:
          type: array
          items:
            type: string
        connected:
          type: boolean

    OAuthImportRequest:
      type: object
      properties:
        token:
          type: string
          description: Credential value (write-only)
        cli_proxy_url:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true

    TunnelStatus:
      type: object
      properties:
        enabled:
          type: boolean
        url:
          type: string
          format: uri
          nullable: true
        provider:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true

    TailscaleStatus:
      type: object
      properties:
        installed:
          type: boolean
        running:
          type: boolean
        funnel_enabled:
          type: boolean
        hostname:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true

    HeadroomStatus:
      type: object
      properties:
        running:
          type: boolean
        pid:
          type: integer
          nullable: true
        port:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true

    HeadroomExtras:
      type: object
      properties:
        installed:
          type: boolean
        version:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
          nullable: true

    PxpipeStatus:
      type: object
      properties:
        running:
          type: boolean
        pid:
          type: integer
          nullable: true
        port:
          type: integer
        version:
          type: string
          nullable: true
        logs_path:
          type: string

    PxpipeLog:
      type: object
      properties:
        line:
          type: string
        at:
          type: string
          format: date-time
        level:
          type: string

    PxpipeStats:
      type: object
      properties:
        lines_total:
          type: integer
        errors:
          type: integer
        last_log_at:
          type: string
          format: date-time
          nullable: true

    MCPMessageRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          default: "2.0"
        id:
          type: integer
          nullable: true
        method:
          type: string
        params:
          type: object

    MCPMessageResponse:
      type: object
      properties:
        jsonrpc:
          type: string
        id:
          type: integer
          nullable: true
        result:
          type: object
          nullable: true
        error:
          type: object
          nullable: true

    MCPEvent:
      type: object
      properties:
        event:
          type: string
        data:
          type: object

    Settings:
      type: object
      properties:
        rtk_enabled:
          type: boolean
        claude_auto_ping:
          type: boolean
        codex_auto_ping:
          type: boolean
        oidc_enabled:
          type: boolean
        oidc_issuer:
          type: string
          format: uri
          nullable: true
        enable_translator:
          type: boolean
        require_login:
          type: boolean
        updated_at:
          type: string
          format: date-time

    DatabaseInfo:
      type: object
      properties:
        driver:
          type: string
        connected:
          type: boolean
        version:
          type: string
          nullable: true
        size_bytes:
          type: integer
        retention_days:
          type: integer

    RequireLoginStatus:
      type: object
      properties:
        require_login:
          type: boolean

    ProxyTestRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          default: GET
        headers:
          type: object

    ProxyTestResult:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: integer
          nullable: true
        latency_ms:
          type: integer
        error:
          type: string
          nullable: true

    TranslationRequest:
      type: object
      required: [text, to]
      properties:
        text:
          type: string
        from:
          type: string
          nullable: true
        to:
          type: string
        provider:
          type: string
          nullable: true

    TranslationResponse:
      type: object
      properties:
        translated:
          type: string
        provider:
          type: string
        latency_ms:
          type: integer

    TranslatorState:
      type: object
      properties:
        enabled:
          type: boolean
        providers:
          type: array
          items:
            type: string
        default_provider:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time

    TranslatorSaveRequest:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
        provider:
          type: string
        config:
          type: object

    TranslatorSendRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        provider:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true

    ConsoleLog:
      type: object
      properties:
        line:
          type: string
        at:
          type: string
          format: date-time
        level:
          type: string

    JobRun:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped]
        error:
          type: string
          nullable: true

    JobInfo:
      type: object
      properties:
        type:
          type: string
        schedule:
          type: string
        status:
          type: string
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        last_run_status:
          type: string
          nullable: true

    JobHistory:
      type: object
      properties:
        type:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/JobRun'

    JobEvent:
      type: object
      properties:
        event:
          type: string
        type:
          type: string
        status:
          type: string
        at:
          type: string
          format: date-time

    Backup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        sha256:
          type: string
        bytes:
          type: integer
        status:
          type: string
          enum: [pending, complete, failed]
        verified_at:
          type: string
          format: date-time
          nullable: true

    BackupVerifyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
        sha256_match:
          type: boolean
        message:
          type: string

    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          format: uuid
          nullable: true
        actor_kind:
          type: string
          enum: [user, job]
        origin:
          type: string
        ip:
          type: string
          nullable: true
        action:
          type: string
        target:
          type: string
          nullable: true
        correlation_id:
          type: string
          nullable: true
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true

    AuditExport:
      type: object
      properties:
        exported_at:
          type: string
          format: date-time
        total:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

    VersionInfo:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
          nullable: true
        has_update:
          type: boolean

    UpdateStatus:
      type: object
      properties:
        checking:
          type: boolean
        available:
          type: boolean
        version:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    InitRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    InitResponse:
      type: object
      properties:
        initialized:
          type: boolean
        user:
          $ref: '#/components/schemas/User'

    LocaleCatalog:
      type: object
      properties:
        locale:
          type: string
        messages:
          type: object

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string

paths:
  /health:
    get:
      operationId: getHealth
      summary: Public health check
      description: |
        Minimal public health probe. Returns status only.
        Actor: None (public); Scope: read (public).
      tags: [Health]
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health/detailed:
    get:
      operationId: getDetailedHealth
      summary: Detailed health (authenticated)
      description: |
        Detailed service health and runtime diagnostics for authenticated operators.
        Actor: session, PAT; Scope: read.
      tags: [Health]
      security:
        - SessionCookie: []
        - PAT: []
      responses:
        '200':
          description: Detailed service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedHealth'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      operationId: login
      summary: Dashboard login
      description: |
        Sign in with email and password. Subject to progressive lockout with 429 responses.
        Actor: None (public); Scope: session (create).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Locked out; retry after Retry-After seconds

  /auth/logout:
    post:
      operationId: logout
      summary: Dashboard logout
      description: |
        End the current dashboard session and revoke its cookie.
        Actor: session; Scope: session (delete).
      tags: [Auth]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      description: |
        Return the authenticated user profile.
        Actor: session, PAT; Scope: read.
      tags: [Auth]
      security:
        - SessionCookie: []
        - PAT: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/status:
    get:
      operationId: getAuthStatus
      summary: Authentication status
      description: |
        Return the current authentication status and CSRF token state.
        Actor: session, PAT; Scope: read.
      tags: [Auth]
      security:
        - SessionCookie: []
        - PAT: []
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'

  /auth/oidc/start:
    get:
      operationId: oidcStart
      summary: Start OIDC sign-in
      description: |
        Begin an OIDC sign-in flow; issues a single-use state cookie.
        Actor: None (public); Scope: session (create).
      tags: [Auth]
      responses:
        '302':
          description: Redirect to the OIDC issuer
        '400':
          description: Invalid or insecure issuer configuration

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Complete OIDC sign-in
      description: |
        Complete the OIDC callback; enforces PKCE, nonce, audience and replay protection.
        Actor: None (public); Scope: session (create).
      tags: [Auth]
      responses:
        '302':
          description: Redirect to the dashboard with a session cookie
        '400':
          description: Callback validation failed

  /auth/oidc/test:
    post:
      operationId: oidcTest
      summary: Test OIDC configuration
      description: |
        Validate the OIDC issuer configuration end to end.
        Actor: session, PAT; Scope: config (read).
      tags: [Auth]
      security:
        - SessionCookie: []
        - PAT: []
      responses:
        '200':
          description: OIDC configuration valid
